[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fishmambatrack"
version = "1.0.0"
description = "Reliability-first temporal identity memory for underwater fish tracking"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "mamba-ssm==2.2.5",
  "causal-conv1d==1.5.2",
  "einops==0.8.1",
  "ninja==1.13.0",
  "packaging==25.0",
  "psutil==7.0.0",
]

[tool.setuptools.packages.find]
include = ["fishmambatrack*", "experiments*"]
