[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fishmambatrack"
version = "0.0.1"
description = "FishMambaTrack - CNN+Mamba MOT baseline skeleton"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["fishmambatrack*"]
