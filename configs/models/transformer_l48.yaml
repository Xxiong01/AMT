model:
  name: transformer_lite
  pool_mode: mean
  config:
    temporal_d_model: 256
    temporal_layers: 2
    temporal_nhead: 4
    temporal_ff_mult: 2
    temporal_dropout: 0.10
    max_seq_len: 48
    emb_dim: 256
sequence:
  length: 48
  frame_stride: 1
  seq_stride: 3
  max_gap: 2
data:
  root: data/MFT25-reid-protocol
  sequence_glob: '*'
  train_gt_file: gt_train_fit.txt
  dev_gt_file: gt_dev.txt
  full_gt_file: gt.txt
  input_size: [128, 256]
  crop_pad: 0.10
  train_index_cache: outputs/index/transformer_l48_train.pkl
  dev_index_cache: outputs/index/transformer_l48_dev.pkl
training:
  epochs: 100
  batch_size: 16
  evaluation_batch_size: 8
  instances_per_identity: 4
  workers: 4
  pin_memory: true
  learning_rate: 0.0003
  weight_decay: 0.0001
  triplet_margin: 0.3
